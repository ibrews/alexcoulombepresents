<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alex Coulombe Presents — social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #060810;
    color: #ecedf6;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 700px 500px at 18% 55%, rgba(155, 140, 255, 0.16), transparent 70%),
      radial-gradient(ellipse 600px 420px at 88% 8%, rgba(45, 212, 191, 0.14), transparent 70%),
      radial-gradient(ellipse 500px 380px at 70% 95%, rgba(251, 191, 36, 0.08), transparent 70%);
  }
  canvas#stars { position: absolute; inset: 0; }
  .content {
    position: absolute; left: 70px; top: 0; bottom: 0; width: 640px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .tag {
    display: inline-flex; align-self: flex-start; align-items: center; gap: 10px;
    border: 1px solid rgba(45, 212, 191, 0.45); border-radius: 999px;
    padding: 8px 18px; font-size: 17px; letter-spacing: 2.5px;
    text-transform: uppercase; color: #2dd4bf; margin-bottom: 30px;
  }
  .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #2dd4bf; }
  h1 {
    font-size: 88px; line-height: 0.98; font-weight: 700; letter-spacing: -2px;
    background: linear-gradient(130deg, #fff 20%, #a5d8ff 55%, #9b8cff 90%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1 .presents {
    background: linear-gradient(100deg, #2dd4bf, #a78bfa 55%, #fbbf24);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { margin-top: 26px; font-size: 26px; line-height: 1.45; color: #9b9bb5; max-width: 600px; }
  .tagline strong { color: #ecedf6; font-weight: 500; }
  .pill {
    margin-top: 36px; align-self: flex-start;
    background: #ecedf6; color: #060810; border-radius: 999px;
    padding: 13px 28px; font-size: 21px; font-weight: 700;
  }
  .corner { position: absolute; bottom: 34px; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #5b5b78; }
  .corner.left { left: 70px; }
  .corner.right { right: 64px; }
  /* headset constellation */
  .graphic { position: absolute; right: 30px; top: 70px; width: 470px; height: 470px; }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="stars" width="1200" height="630"></canvas>

  <svg class="graphic" viewBox="0 0 470 470" fill="none">
    <defs>
      <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2dd4bf"/>
        <stop offset="0.55" stop-color="#a78bfa"/>
        <stop offset="1" stop-color="#fbbf24"/>
      </linearGradient>
    </defs>
    <g transform="translate(-58,148) scale(1.05)">
      <rect x="120" y="22" width="320" height="156" rx="18" stroke="#2a2a44" stroke-width="3" fill="#0d0d1a"/>
      <g fill="url(#wire)">
        <circle cx="146" cy="44" r="5"/><circle cx="190" cy="44" r="5"/><circle cx="234" cy="44" r="5"/><circle cx="280" cy="44" r="5"/><circle cx="326" cy="44" r="5"/><circle cx="370" cy="44" r="5"/><circle cx="414" cy="44" r="5"/>
        <circle cx="146" cy="156" r="5"/><circle cx="190" cy="156" r="5"/><circle cx="234" cy="156" r="5"/><circle cx="280" cy="156" r="5"/><circle cx="326" cy="156" r="5"/><circle cx="370" cy="156" r="5"/><circle cx="414" cy="156" r="5"/>
      </g>
      <text x="280" y="91" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="28" font-weight="700" fill="#ecedf6" letter-spacing="1.5">ALEX COULOMBE</text>
      <rect x="200" y="106" width="160" height="32" rx="16" fill="url(#wire)"/>
      <text x="280" y="128" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="16" font-weight="700" fill="#07070f" letter-spacing="6">PRESENTS</text>
      <g transform="translate(170,122)">
        <path d="M0 -11 L3.2 -3.2 L11 0 L3.2 3.2 L0 11 L-3.2 3.2 L-11 0 L-3.2 -3.2 Z" fill="#2dd4bf"/>
        <path d="M0 -16 v4 M0 12 v4 M-16 0 h4 M12 0 h4" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(390,122)">
        <path d="M0 -11 L3.2 -3.2 L11 0 L3.2 3.2 L0 11 L-3.2 3.2 L-11 0 L-3.2 -3.2 Z" fill="#fbbf24"/>
        <path d="M0 -16 v4 M0 12 v4 M-16 0 h4 M12 0 h4" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </svg>

  <div class="content">
    <div class="tag"><span class="dot"></span> alexcoulombepresents.com</div>
    <h1>Alex Coulombe<br><span class="presents">Presents</span></h1>
    <p class="tagline"><strong>Unreal Engine · Godot · Vision Pro · AI agents</strong> — worlds you can step inside, and the training to build your own.</p>
    <div class="pill">Enter the site →</div>
  </div>

  <div class="corner left">XR-chitect · NYC</div>
  <div class="corner right">Training · Open Source · The Lab</div>

  <script>
    const c = document.getElementById('stars');
    const ctx = c.getContext('2d');
    for (let i = 0; i < 130; i++) {
      const x = Math.random() * 1200, y = Math.random() * 630;
      const r = Math.random() * 1.4 + 0.3;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(236, 237, 246, ${Math.random() * 0.5 + 0.12})`;
      ctx.fill();
    }
  </script>
</body>
</html>
