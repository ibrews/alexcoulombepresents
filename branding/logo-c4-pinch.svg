<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- marquee sign -->
  <rect x="120" y="22" width="320" height="156" rx="18" stroke="#1e1e33" stroke-width="3" fill="#0d0d1a"/>
  <!-- bulbs -->
  <g fill="url(#g)">
    <circle cx="146" cy="44" r="5"/><circle cx="190" cy="44" r="5"/><circle cx="234" cy="44" r="5"/><circle cx="280" cy="44" r="5"/><circle cx="326" cy="44" r="5"/><circle cx="370" cy="44" r="5"/><circle cx="414" cy="44" r="5"/>
    <circle cx="146" cy="156" r="5"/><circle cx="190" cy="156" r="5"/><circle cx="234" cy="156" r="5"/><circle cx="280" cy="156" r="5"/><circle cx="326" cy="156" r="5"/><circle cx="370" cy="156" r="5"/><circle cx="414" cy="156" r="5"/>
  </g>
  <!-- stacked name -->
  <text x="280" y="92" text-anchor="middle" font-family="'Space Grotesk','Arial',sans-serif" font-size="34" font-weight="700" fill="#ecedf6" letter-spacing="2">ALEX COULOMBE</text>
  <!-- gradient banner -->
  <rect x="200" y="106" width="160" height="32" rx="16" fill="url(#g)"/>
  <text x="280" y="128" text-anchor="middle" font-family="'Space Grotesk','Arial',sans-serif" font-size="16" font-weight="700" fill="#07070f" letter-spacing="6">PRESENTS</text>
  <!-- left pinch reaching toward banner -->
  <g transform="translate(168,122)">
    <path d="M-22 -16 Q -6 -14 2 -4" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-22 14 Q -7 13 1 5" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M8 0 L11.5 -3.5 L15 0 L11.5 3.5 Z" fill="#fbbf24"/>
  </g>
  <!-- right pinch (mirrored) -->
  <g transform="translate(392,122) scale(-1,1)">
    <path d="M-22 -16 Q -6 -14 2 -4" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-22 14 Q -7 13 1 5" stroke="#a78bfa" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M8 0 L11.5 -3.5 L15 0 L11.5 3.5 Z" fill="#fbbf24"/>
  </g>
</svg>
