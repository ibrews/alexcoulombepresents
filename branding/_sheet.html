<!DOCTYPE html><html><head><meta charset="utf-8">

<div class="row"><h3>C · Marquee</h3><div class="cell"><object data="logo-c-marquee.svg" type="image/svg+xml"></object></div></div>
<div class="row"><h3>D · Portal</h3><div class="cell"><object data="logo-d-portal.svg" type="image/svg+xml"></object></div></div>
<div class="row"><h3>E · Prompt</h3><div class="cell"><object data="logo-e-prompt.svg" type="image/svg+xml"></object></div></div>
</body></html>
