  <path d="M250 94 C 270 94 270 76 254 72" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
  <!-- nose notch -->
  <path d="M112 146 q 28 -20 56 0" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
  <!-- lenses with monogram -->
  <circle cx="92" cy="92" r="33" stroke="#2dd4bf" stroke-width="3.5"/>
  <circle cx="188" cy="92" r="33" stroke="#a78bfa" stroke-width="3.5"/>
