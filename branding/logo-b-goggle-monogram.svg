  <text x="188" y="106" text-anchor="middle" font-family="'Space Grotesk','Arial',sans-serif" font-size="42" font-weight="700" fill="#a78bfa">C</text>
  <!-- wordmark -->
  <text x="292" y="90" font-family="'Space Grotesk','Arial',sans-serif" font-size="36" font-weight="700" fill="#ecedf6">Alex Coulombe</text>
  <text x="292" y="134" font-family="'Space Grotesk','Arial',sans-serif" font-size="28" font-weight="500" fill="url(#g)" letter-spacing="9">PRESENTS</text>
